name: Galaxy F22 (SM-E225F) Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "copilot/**" ]

jobs:
  build:
    name: Build Kernel (LineageOS Logic)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # CACHING: Saves time by not re-downloading Clang every run
      # -----------------------------------------------------------------------
      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Setup Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          echo "Cloning Proton Clang..."
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/toolchains/clang

      # -----------------------------------------------------------------------
      # DEPENDENCIES: Standard build tools required by kernel.mk
      # -----------------------------------------------------------------------
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler

      # -----------------------------------------------------------------------
      # KERNELSU-NEXT: Using Legacy Setup Script
      # -----------------------------------------------------------------------
      - name: Setup KernelSU-Next
        run: |
          echo "=========================================="
          echo "KernelSU-Next Setup (Legacy)"
          echo "=========================================="
          
          # Download and run KernelSU-Next legacy setup script
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          
          echo "=========================================="
          echo "✓ KernelSU-Next setup complete"
          echo "=========================================="

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/AlfCraft07/AnyKernel3.git ~/AnyKernel3
          cd ~/AnyKernel3
          cat > anykernel.sh << 'EOF'
          #!/sbin/sh
          # AnyKernel3 Script for f22
          
          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=slmkernel for mt6768 platform - Built for f22 (SM-E225F)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=f22
          device.name2=SM-E225F
          supported.versions=11-17
          supported.patchlevels=
          '; } # end properties
          
          ## AnyKernel boot install
          # begin attributes
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          
          # boot header version 2 for this device
          boot_img_hdr_ver=2
          # end attributes
          
          ## AnyKernel methods (DO NOT CHANGE)
          # import patching functions/variables - see for reference
          . tools/ak3-core.sh;
          
          ## AnyKernel boot install
          split_boot; # use split_boot to extract ramdisk and kernel
          
          # Install kernel image
          flash_boot;
          ## end boot install
          EOF
          chmod +x anykernel.sh

      # -----------------------------------------------------------------------
      # BUILD LOGIC: Extracted directly from LineageOS kernel.mk
      # -----------------------------------------------------------------------
      - name: Compile Kernel
        run: |
          # Fix CRLF line endings in vendor Kconfig files
          find drivers/sensorhub -name "Kconfig*" -exec dos2unix {} + 2>/dev/null || true
          # 1. Setup Environment Variables
          export PATH=~/toolchains/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          MAKE_ARGS=(
            ARCH=arm64
            SUBARCH=arm64
            O=out
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE64=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
            KCFLAGS="-w"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )
          # 2. Clean output dir
          rm -rf out && mkdir -p out
          # 3. Build Base Config
          echo "--> Generating Base Config: mt6768_slm_defconfig"
          make "${MAKE_ARGS[@]}" mt6768_slm_defconfig
          # 4. Merge Fragments
          echo "--> Merging Fragments..."
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/f22.config
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/battery.config
          make "${MAKE_ARGS[@]}" olddefconfig
          
          # 5. Compile Image.gz (defconfig removed from targets)
          echo "--> Building kernel..."
          echo "--> Compiling Image.gz..."
          set -o pipefail
          make -j$(nproc) "${MAKE_ARGS[@]}" Image.gz 2>&1 | tee build.log
          BUILD_STATUS=$?
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build failed with status $BUILD_STATUS"
            echo "==================== COMPILER ERRORS ===================="
            grep -i -n -E "error:|fatal error:|undefined reference" build.log -B 2 -A 5 || true
            echo "=========================================================="
            echo "Last 100 lines of build log:"
            tail -100 build.log
            exit $BUILD_STATUS
          fi

      # -----------------------------------------------------------------------
      # PACKAGING: AnyKernel3
      # -----------------------------------------------------------------------
      - name: Create Flashable ZIP
        run: |
          cd ~/AnyKernel3
          rm -rf .git* README.md
          
          # Create custom README for the ZIP
          cat > README.md << 'EOF'
          # slmkernel for f22
          
          ## What's Included
          - slmkernel for f22 with 5.15 BPF backports
          - Image.gz - Kernel image for overlay-enabled device
          - AnyKernel3 flasher script
          
          ## How to Flash
          
          ### LineageOS Users (No TWRP needed!)
          1. Boot into LineageOS Recovery (Vol Up + Power)
          2. Navigate: Apply update → Apply from ADB
          3. On PC: `adb sideload slmkernel-f22-YYYYMMDD.zip`
          4. Reboot and enjoy!
          
          ### TWRP/OrangeFox Users
          1. Boot into TWRP/OrangeFox recovery
          2. Flash this ZIP file
          3. Reboot and enjoy!
          
          ## Device Compatibility
          - Samsung Galaxy F22 (SM-E225F)
          - Models: f22
          - Android 11-17 / LineageOS 18-24
          
          ## Credits
          - @IamKavy47 for the script
          - @mertsan2007 for the kernel
          
          ---
          EOF
          
          # Copy Artifacts
          # For overlay-enabled devices, use Image.gz (overlays applied by bootloader)
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz ]; then
             cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz .
             echo "✓ Copied Image.gz"
          else
             echo "Build Failed: Image.gz not found"
             exit 1
          fi
          
          # Verify package contents
          echo "Package contents:"
          ls -lah
          
          # Create ZIP
          ZIPNAME="slmkernel-f22-$(date +%Y%m%d).zip"
          zip -r9 $GITHUB_WORKSPACE/$ZIPNAME *
          echo "✓ Created $ZIPNAME"
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIPNAME }}
          archive: false

      - name: Upload Build Log (Debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log